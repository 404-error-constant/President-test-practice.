<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>US Presidents Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 0;
      overflow-y: auto;
    }

    .quiz-container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 500px;
      text-align: center;
      box-sizing: border-box;
    }

    .choice-btn, .menu-btn {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.75rem;
      font-size: 1rem;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #f9f9f9;
      transition: background 0.2s;
    }

    .choice-btn:hover, .menu-btn:hover {
      background-color: #e0e0e0;
    }

    .menu-btn {
        background-color: #007bff;
        color: white;
        border: none;
        font-weight: bold;
    }

    .menu-btn:hover {
        background-color: #0056b3;
    }

    .dark-mode {
      background-color: #333333;
      color: white;
    }

    .dark-mode .quiz-container {
      background: #444;
      color: white;
    }

    .dark-mode .choice-btn {
      background: #555;
      color: white;
      border-color: #888;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #loading-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #feedback {
      margin-top: 1rem;
      font-weight: bold;
    }

    .dashboard-section {
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #eee;
    }

    .site-footer {
      margin-top: 2rem;
      padding: 1rem;
      font-size: 0.8rem;
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body>

<div id="loading-screen">
  <video id="loading-video" autoplay muted playsinline>
    <source src="loading.mp4" type="video/mp4">
  </video>
</div>

<div class="quiz-container" id="dashboard" style="display:none;">
    <h1>Quiz Dashboard</h1>
    <div class="dashboard-section">
        <p>Select Game Mode:</p>
        <button class="menu-btn" onclick="setMode('classic')">Classic (All Questions)</button>
        <button class="menu-btn" onclick="setMode('years')">Years Served Only</button>
    </div>
    <div class="dashboard-section">
        <label>
            <input type="checkbox" id="shuffle-toggle"> Randomize President Order
        </label>
    </div>
    <button onclick="myFunction()">Toggle dark mode 🕶️</button>
</div>

<div class="quiz-container" id="quiz" style="display:none;">
  <h2 id="question">Loading...</h2>
  <div id="choices"></div>
  <p id="feedback"></p>
  <button onclick="location.reload()" style="margin-top:10px; font-size: 0.7rem;">Quit to Menu</button>
</div>

<script>
let presidents = [
  { number: 1, name: "George Washington", years: "1789–1797", party: "None" }, 
  { number: 2, name: "John Adams", years: "1797–1801", party: "Federalist" }, 
  { number: 3, name: "Thomas Jefferson", years: "1801–1809", party: "Democratic-Republican" }, 
  { number: 4, name: "James Madison", years: "1809–1817", party: "Democratic-Republican" }, 
  { number: 5, name: "James Monroe", years: "1817–1825", party: "Democratic-Republican" }, 
  { number: 6, name: "John Quincy Adams", years: "1825–1829", party: "Democratic-Republican/National Republican" }, 
  { number: 7, name: "Andrew Jackson", years: "1829–1837", party: "Democratic" }, 
  { number: 8, name: "Martin Van Buren", years: "1837–1841", party: "Democratic" }, 
  { number: 9, name: "William Henry Harrison", years: "1841", party: "Whig" }, 
  { number: 10, name: "John Tyler", years: "1841–1845", party: "Whig" },
  { number: 11, name: "James K. Polk", years: "1845–1849", party: "Democratic" },
  { number: 12, name: "Zachary Taylor", years: "1849–1850", party: "Whig" },
  { number: 13, name: "Millard Fillmore", years: "1850–1853", party: "Whig" },
  { number: 14, name: "Franklin Pierce", years: "1853–1857", party: "Democratic" },
  { number: 15, name: "James Buchanan", years: "1857–1861", party: "Democratic" },
  { number: 16, name: "Abraham Lincoln", years: "1861–1865", party: "Republican" },
  { number: 17, name: "Andrew Johnson", years: "1865–1869", party: "National Union/Democratic" },
  { number: 18, name: "Ulysses S. Grant", years: "1869–1877", party: "Republican" },
  { number: 19, name: "Rutherford B. Hayes", years: "1877–1881", party: "Republican" },
  { number: 20, name: "James A. Garfield", years: "1881", party: "Republican" },
  { number: 21, name: "Chester A. Arthur", years: "1881–1885", party: "Republican" },
  { number: 22, name: "Grover Cleveland", years: "1885–1889", party: "Democratic" },
  { number: 23, name: "Benjamin Harrison", years: "1889–1893", party: "Republican" },
  { number: 24, name: "Grover Cleveland", years: "1893–1897", party: "Democratic" },
  { number: 25, name: "William McKinley", years: "1897–1901", party: "Republican" },
  { number: 26, name: "Theodore Roosevelt", years: "1901–1909", party: "Republican" },
  { number: 27, name: "William Howard Taft", years: "1909–1913", party: "Republican" },
  { number: 28, name: "Woodrow Wilson", years: "1913–1921", party: "Democratic" },
  { number: 29, name: "Warren G. Harding", years: "1921–1923", party: "Republican" },
  { number: 30, name: "Calvin Coolidge", years: "1923–1929", party: "Republican" },
  { number: 31, name: "Herbert Hoover", years: "1929–1933", party: "Republican" },
  { number: 32, name: "Franklin D. Roosevelt", years: "1933–1945", party: "Democratic" },
  { number: 33, name: "Harry S. Truman", years: "1945–1953", party: "Democratic" },
  { number: 34, name: "Dwight D. Eisenhower", years: "1953–1961", party: "Republican" },
  { number: 35, name: "John F. Kennedy", years: "1961–1963", party: "Democratic" },
  { number: 36, name: "Lyndon B. Johnson", years: "1963–1969", party: "Democratic" },
  { number: 37, name: "Richard Nixon", years: "1969–1974", party: "Republican" },
  { number: 38, name: "Gerald Ford", years: "1974–1977", party: "Republican" },
  { number: 39, name: "Jimmy Carter", years: "1977–1981", party: "Democratic" },
  { number: 40, name: "Ronald Reagan", years: "1981–1989", party: "Republican" },
  { number: 41, name: "George H. W. Bush", years: "1989–1993", party: "Republican" },
  { number: 42, name: "Bill Clinton", years: "1993–2001", party: "Democratic" },
  { number: 43, name: "George W. Bush", years: "2001–2009", party: "Republican" },
  { number: 44, name: "Barack Obama", years: "2009–2017", party: "Democratic" },
  { number: 45, name: "Donald Trump", years: "2017–2021", party: "Republican" },
  { number: 46, name: "Joe Biden", years: "2021–2024", party: "Democratic" },
  { number: 47, name: "Donald Trump", years: "2025–Present", party: "Republican" }
];

let username = localStorage.getItem("quiz_username") || "Anonymous";
let startTime, endTime;
let questionStages = ['name', 'years', 'party'];
let current = 0;
let stage = 0;
let score = 0;
let totalPossiblePoints = 0;

const loadingVideo = document.getElementById('loading-video');
const loadingScreen = document.getElementById('loading-screen');
const dashboard = document.getElementById('dashboard');
const quiz = document.getElementById('quiz');
const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const feedbackEl = document.getElementById("feedback");

loadingVideo.onended = () => {
    loadingScreen.style.display = "none";
    dashboard.style.display = "block";
};

function myFunction() {
    document.body.classList.toggle("dark-mode");
}

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function setMode(mode) {
    if (mode === 'years') {
        questionStages = ['years'];
    } else {
        questionStages = ['name', 'years', 'party'];
    }
    
    if (document.getElementById('shuffle-toggle').checked) {
        presidents = shuffle([...presidents]);
    }
    
    totalPossiblePoints = presidents.length * questionStages.length;
    startQuiz();
}

function startQuiz() {
    dashboard.style.display = "none";
    quiz.style.display = "block";
    startTime = Date.now();
    loadQuestion();
}

function getOrdinalSuffix(n) {
    const s = ["th", "st", "nd", "rd"];
    const v = n % 100;
    return s[(v - 20) % 10] || s[v] || s[0];
}

function loadQuestion() {
    feedbackEl.textContent = "";
    const p = presidents[current];
    const type = questionStages[stage];
    let correctAnswer;
    let options;

    if (type === 'name') {
        questionEl.textContent = `Who was the ${p.number}${getOrdinalSuffix(p.number)} President?`;
        correctAnswer = p.name;
        options = presidents.map(x => x.name);
    } else if (type === 'years') {
        questionEl.textContent = `What years did ${p.name} (#${p.number}) serve?`;
        correctAnswer = p.years;
        options = presidents.map(x => x.years);
    } else if (type === 'party') {
        questionEl.textContent = `What was ${p.name}'s political party?`;
        correctAnswer = p.party;
        options = presidents.map(x => x.party);
    }

    createChoices(correctAnswer, options);
}

function createChoices(correct, allOptions) {
    const uniqueOptions = [...new Set(allOptions)];
    const filtered = uniqueOptions.filter(opt => opt !== correct);
    const shuffledWrong = shuffle(filtered).slice(0, 3);
    const finalOptions = shuffle([correct, ...shuffledWrong]);
    
    choicesEl.innerHTML = "";
    finalOptions.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = option;
        btn.onclick = () => handleAnswer(option, correct);
        choicesEl.appendChild(btn);
    });
}

function handleAnswer(selected, correct) {
    if (selected === correct) {
        feedbackEl.textContent = "Correct!";
        stage++;
        if (stage >= questionStages.length) {
            stage = 0;
            current++;
        }
        setTimeout(() => {
            if (current >= presidents.length) {
                finishQuiz();
            } else {
                loadQuestion();
            }
        }, 600);
    } else {
        score += 1;
        feedbackEl.textContent = "❌ Try again!";
    }
}

function finishQuiz() {
    endTime = Date.now();
    let elapsed = Math.floor((endTime - startTime) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const ss = String(elapsed % 60).padStart(2, '0');
    const timeTaken = `${mm}:${ss}`;

    questionEl.textContent = `Finished! ${score} mistakes out of ${totalPossiblePoints} points.`;
    choicesEl.innerHTML = `<h3>Time: ${timeTaken}</h3><button class="menu-btn" onclick="location.reload()">Back to Dashboard</button>`;
    feedbackEl.textContent = "";

    fetch("https://script.google.com/macros/s/AKfycbxD5NQlEQmip-q-ycolIVpJdVkCDqqOD49gOCnhJYrWGmNCgZlTzj2cg45EZi96gFE2Dg/exec", {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            username: username,
            score: totalPossiblePoints - score,
            time: timeTaken
        })
    });
}
</script>

<footer class="site-footer">
  <div>Official release v1.9.0, April 2026</div>
  <div>Built by Caleb Ybarra</div>
</footer>

</body>
</html>

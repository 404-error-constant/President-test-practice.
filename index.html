  <style>
    
   body {

}

.choice-btn:hover {
  background-color: #e0e0e0;
}


.dark-mode {
  background-color: #333333;
  color: white;
}

.dark-mode .quiz-container {
  background: #444;
  color: white;
}

.dark-mode .choice-btn {
  background: #555;
  color: white;
  border-color: #888;
}

.dark-mode .choice-btn:hover {
  background: #666;
}

#loading-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#loading-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#feedback {
  margin-top: 1rem;
  font-weight: bold;
}

.site-footer {
  margin-top: 2rem;
  padding: 1rem;
  font-size: 0.8rem;
  text-align: center;
  color: #666;
  line-height: 1.4;
}

.site-footer a {
  color: #666;
  text-decoration: underline;
}

.privacy-note {
  margin-top: 0.5rem;
  font-style: italic;
  opacity: 0.8;
}

<body>
  <div id="loading-screen">
  <video id="loading-video" autoplay muted playsinline>
    <source src="loading.mp4" type="video/mp4">
  </video>
</div>

  <div class="quiz-container" id="quiz" style="display:none;">
    <h2 id="question">Yeah, somethings broken...</h2>
    <div id="choices"></div>
    <p id="feedback"></p>
  </div>
  <button onclick="myFunction()">Toggle dark mode 🕶️</button>



 <script>
  // Prompt for username once and save in localstorage
function formatUsername(input) {
  if (!input || !input.replace(/[^a-zA-Z\s]/g, "").trim()) {
  return "Anonymous";
}


  // Keep only letters and spaces
  let clean = input.replace(/[^a-zA-Z\s]/g, "").trim();

  // Split on first space only
  const spaceIndex = clean.indexOf(" ");

  if (spaceIndex === -1) {
    // No space → just first name
    return clean;
  }

  const firstName = clean.slice(0, spaceIndex);
  const lastInitial = clean.slice(spaceIndex + 1).trim()[0];

  return lastInitial ? `${firstName} ${lastInitial.toUpperCase()}` : firstName;
}

// Prompt once and store
let username = localStorage.getItem("quiz_username");

if (!username) {
  const raw = prompt("Enter your nickname (full names will be turncated):");
  username = formatUsername(raw);
  localStorage.setItem("quiz_username", username);
}

  let startTime = Date.now();  
  let endTime;                 

  const loadingVideo = document.getElementById('loading-video');
  const loadingScreen = document.getElementById('loading-screen');
  const quiz = document.getElementById('quiz');

  // When video ends, hide loading screen and show quiz, hopefully
  loadingVideo.onended = () => {
    loadingScreen.style.display = "none";
    quiz.style.display = "block";
  };

  function myFunction() {
   var element = document.body;
   element.classList.toggle("dark-mode");
}  
  const presidents = [

  { number: 44, name: "Barack Obama", years: "2009–2017", party: "Democratic" },
  { number: 45, name: "Donald Trump", years: "2017–2021", party: "Republican" },

  { number: 47, name: "Donald Trump", years: "2025–Present", party: "Republican" }

  const questionStages = ['name', 'years', 'party'];
  let current = 0;
  let stage = 0;
  let score = 0;

  const questionEl = document.getElementById("question");
  const choicesEl = document.getElementById("choices");
  const feedbackEl = document.getElementById("feedback");

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  

  function getOrdinalSuffix(n) {
    const s = ["th", "st", "nd", "rd"];
    const v = n % 100;
    return s[(v - 20) % 10] || s[v] || s[0];
  }

  function loadQuestion() {
    feedbackEl.textContent = "";
    const p = presidents[current];
    const type = questionStages[stage];
    let correctAnswer;
    let options;

    if (type === 'name') {
      questionEl.textContent = `Who was the ${p.number}${getOrdinalSuffix(p.number)} President?`;
      correctAnswer = p.name;
      options = presidents.map(x => x.name);
    } else if (type === 'years') {
      questionEl.textContent = `What years did ${p.name} serve?`;
      correctAnswer = p.years;
      options = presidents.map(x => x.years);
    } else if (type === 'party') {
      questionEl.textContent = `What was ${p.name}'s political party?`;
      correctAnswer = p.party;
      options = presidents.map(x => x.party);
    }

    createChoices(correctAnswer, options);
  }

  function createChoices(correct, allOptions) {
    const shuffled = shuffle([...new Set(allOptions)]).filter(opt => opt !== correct).slice(0, 3);
    const finalOptions = shuffle([correct, ...shuffled]);
    choicesEl.innerHTML = "";

    finalOptions.forEach(option => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = option;
      btn.onclick = () => handleAnswer(option, correct);
      choicesEl.appendChild(btn);
    });
  }

  function handleAnswer(selected, correct) {
    if (selected === correct) {
      feedbackEl.textContent = "Correct!";
      stage++;
      if (stage >= questionStages.length) {
        stage = 0;
        current++;
      }
      setTimeout(() => {
        if (current >= presidents.length) {
          finishQuiz();
        } else {
          loadQuestion();
        }
      }, 800);
    } else {
      const messages = ["❌ Try again!", "❌ Be better!"];
      score += 1;
      feedbackEl.textContent = messages[Math.floor(Math.random() * messages.length)];
    }
  }

  function finishQuiz() {
   endTime = Date.now();
let elapsed = Math.floor((endTime - startTime) / 1000); // in seconds

const hours = Math.floor(elapsed / 3600);
elapsed %= 3600;
const minutes = Math.floor(elapsed / 60);
const seconds = elapsed % 60;

//maxium jank
const hh = String(hours).padStart(2, '0');
const mm = String(minutes).padStart(2, '0');
const ss = String(seconds).padStart(2, '0');

const timeTaken = `${hh}:${mm}:${ss}`;  // "01:05:32" style

    questionEl.textContent = ` You finished all questions and only got ${score} wrong out of 141!`;
    choicesEl.innerHTML = "";
    feedbackEl.textContent = "";

    fetch("https://script.google.com/macros/s/AKfycbxD5NQlEQmip-q-ycolIVpJdVkCDqqOD49gOCnhJYrWGmNCgZlTzj2cg45EZi96gFE2Dg/exec", {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: username,
        score: 141 - score,
        time: timeTaken
      })
    });

    const timeEl = document.createElement("p");
    timeEl.textContent = `⏱️ Time taken: ${timeTaken}`;
    timeEl.style.fontWeight = "bold";
    choicesEl.appendChild(timeEl);
  }

  

  loadQuestion();
</script>
